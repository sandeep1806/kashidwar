# Weekly AI content review (cheap and bounded): Sonnet, 40 turns, $3 cap, one focus per
# week of the month (IST): 1 projects · 2 festivals + dates · 3 guides' volatile facts ·
# 4 new developments + broken links + photos · 5th Monday: projects again.
# The first Monday is covered by the monthly full review (monthly-content-review.yml),
# so the weekly schedule skips it. Brief: .claude/content-review.md.
name: Weekly content review

on:
  schedule:
    - cron: "30 23 * * 0" # Mondays 05:00 IST (Sunday 23:30 UTC)
  workflow_dispatch:
    inputs:
      focus:
        description: "What to check (auto = this week's rotation)"
        type: choice
        options: [auto, projects, festivals, guides, developments]
        default: auto

concurrency:
  group: content-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      focus: ${{ steps.plan.outputs.focus }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PICK: ${{ inputs.focus }}
        run: |
          day=$(TZ=Asia/Kolkata date +%-d)
          week=$(( (day - 1) / 7 + 1 ))
          case "$week" in
            1) focus=projects;; 2) focus=festivals;; 3) focus=guides;; 4) focus=developments;; *) focus=projects;;
          esac
          if [ -n "$PICK" ] && [ "$PICK" != "auto" ]; then focus="$PICK"; fi
          run=true
          if [ "$EVENT" = "schedule" ] && [ "$week" = 1 ]; then run=false; echo "First Monday: the monthly full review runs instead."; fi
          echo "IST day $day → week $week → focus $focus (run=$run)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "focus=$focus" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  review:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    # Caps the called workflow: its review job narrows to contents + pull-requests write,
    # its CI trigger job to actions write.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/content-review-run.yml
    secrets: inherit
    with:
      # Model, turn cap and dollar cap for the weekly run; change here.
      model: claude-sonnet-5
      max_turns: 40
      max_budget_usd: "3"
      focus: ${{ needs.plan.outputs.focus }}
      kind: Weekly
